[project]
name = "ai-geo-audit"
version = "0.1.0"
description = "Сервис комплексного аудита сайта"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20,<1.21",
    "asyncpg>=0.31,<0.32",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
