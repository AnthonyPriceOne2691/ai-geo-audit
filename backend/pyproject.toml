[project]
name = "ai-geo-audit"
version = "0.1.0"
description = "Сервис комплексного аудита сайта"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.6,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
