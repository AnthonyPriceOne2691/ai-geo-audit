[project]
name = "ai-geo-audit"
version = "0.1.0"
description = "Сервис комплексного аудита сайта"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20,<1.21",
    "asyncpg>=0.31,<0.32",
    "cryptography==50.0.2",
    "fastapi==0.141.1",
    "pydantic-settings>=2.6,<3",
    "redis==8.1.0",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    # Инструменты гейтов CQG (§5 шаг 4) — точные версии из плана В1а, слово владельца
    # 2026-11-19T10:40Z; строка new_dependency на каждый — в delivery/active/STATUS.md.
    "coverage==7.17.2",
    "detect-secrets==1.5.0",
    "hypothesis==6.170.14",
    "import-linter==2.15",
    "mutmut==3.8.1",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pre-commit==4.7.0",
    "pre-commit-hooks==6.0.0",
    "pytest-cov==7.1.0",
    "pyyaml==6.0.3",
    "ruff==0.17.3",
    "types-pyyaml==6.0.12.20261103",
    "vulture==2.16",
]

[tool.uv]
# Правило 14 суток — нижняя граница возраста пакета: отсечка — момент обновления uv.lock минус
# 14 суток. Замок обновлён 2026-11-19 после 12:00Z.
exclude-newer = "2026-11-05T12:00:00Z"
# starlette 1.7.0 — пара с fastapi 0.141.1, как у соседа в бою: поведение сверено по ней
# (решение проверяющего 2026-11-19). Прямой зависимостью она не становится.
constraint-dependencies = ["starlette==1.7.0"]
# uv — одна версия на машине, в CI и в образе: чужая версия отказывает, а не молча переписывает
# uv.lock (A123).
required-version = "==0.11.26"

[tool.uv.exclude-newer-package]
# Уже стоят в замке и моложе отсечки — не откатываем (решение проверяющего 2026-11-19).
sqlalchemy = "2026-11-17T00:00:00Z"
pydantic-settings = "2026-11-14T00:00:00Z"
pytest-asyncio = "2026-11-13T00:00:00Z"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# --- ruff (backend) -----------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations", ".venv", "venv", "__pycache__"]

[tool.ruff.lint]
# ⚠ Шесть комплексити-правил (C901, PLR0911/0912/0913/0915, PLR1702) — СРАЗУ в ignore ниже,
# потому что §5 разворачивает гейт сложности всегда: `check_complexity_gate.sh`
# сам сбрасывает ignore (`lint.ignore=[]`) и сверяет находки со СНИМКОМ — ратчет:
# новое нарушение красное, легаси из снимка живёт до чистки. Если отдать правила
# основному хуку, снимок ни на что не влияет и pre-commit на любом легаси с одной
# сложной функцией красный НАВСЕГДА. lab-11 (обе арки): фрагмент отгружался с
# правилами в select ПРОТИВ этого же предупреждения — ratchet зелёный, ruff
# красный на том же файле, и первый прогон читался как дефект проекта.
# `C90`/`PL` из select НЕ убраны: там живут PLE/PLW/PLC, гейт их не заменяет.
# НЕ разворачиваешь гейт сложности (нестандартно) — удали правила из ignore,
# иначе сложность не судит никто (PLR1702 без `preview` хук не судит и тогда).
# Список ниже обязан совпадать с дефолтом RULES гейта — расхождение ловит тест
# (правка на класс = список в оракуле).
select = ["E","W","F","I","N","UP","B","C4","C90","SIM","RUF","ASYNC","S","PT","RET","PIE","PL","TRY400","DTZ"]
# PLR1702 судит гейт с `--preview`; хук идёт без preview и считает правило
# невключённым, поэтому `RUF100` объявил бы поштучный `noqa` на нём лишним, а
# `--fix` вырезал бы его (замер на ruff 0.6.9 и 0.16.6). `external` это снимает.
external = ["PLR1702"]
ignore = [
    # "E501" — вне ignore: адаптация (scripts/lint/adapted.json). Литерал и комментарий
    # длиннее 100 форматтер не переносит, и длину строки иначе не судит никто (A93).
    "S101",                 # assert разрешён
    # ⚠ Из bandit-семейства здесь лежат РОВНО ДВА кода, и у каждого причина —
    # «правило неверно для штатной архитектуры», а не «шумит». До cqg@1.51 их было
    # восемь одной строкой с подписью «bandit-шум», и выключены были ровно те
    # проверки, что судят вершину списка типовых ошибок модели: md5/sha1 вместо
    # sha256 (S324), pickle на недоверенном входе (S301), `random` для токена
    # (S311), пароль строкой (S105/S106), команда из непроверенного значения
    # (S603). Для человека такая строка защитима, для агента нет: lab-12 засеяла
    # md5 — не остановил никто, потому что судить было НЕЧЕМ.
    # Escape — поштучный `noqa: <CODE> -- <причина>` (форма §2.2), не этот список:
    # он виден в диффе и на ревью, строка в ignore не видна нигде. И он не гниёт:
    # `RUF100` (в select выше) краснеет на подавление, которое перестало быть
    # нужным, — то есть escape снимается вместе с причиной, а не остаётся навсегда.
    # ⚠ Решётка перед `noqa` здесь опущена НАМЕРЕННО: в питон-файле она сделала бы
    # это пояснение настоящей директивой, а `RUF100 --fix` вырезал бы текст (§2.2,
    # замер). Форма упоминания одна во всём каноне — так её не скопируют в код.
    # У S324 escape лучше noqa и стоит в самом коде:
    # `hashlib.md5(data, usedforsecurity=False)` — ruff молчит (замерено), и
    # «это не крипто» объявлено там, где читают, а не в конфиге.
    # Шум тестовых фикстур этого списка не касается: `per-file-ignores` ниже
    # гасит в `tests/**` всё семейство `S` целиком.
    "S104",                 # bind 0.0.0.0 — в контейнере норма; иначе noqa на каждом entrypoint
    "S607",                 # частичный путь: `git`/`npm` по имени штатно, абсолютный ХУЖЕ (портируемость)
    "C901","PLR0911","PLR0912","PLR0913","PLR0915","PLR1702",  # сложность судит ГЕЙТ со снимком (§3), не хук
    "PLR2004",              # magic-value — шумно
    "B008",                 # DI-объект как default аргумента (напр. FastAPI Depends())
    "RUF001","RUF002","RUF003",  # ambiguous unicode — не-ASCII в строках/логах
    "PLC0415",              # import-outside-top-level — осознанный lazy-import паттерн
]
# tests-код имеет свои послабления:
per-file-ignores = { "tests/**/*.py" = ["S","PLR2004","PLR0915","PLR0912","PLR1702","C901","PLC0415","B017","PT011","PT012","PT018","N806","N803","N802","E402","SIM117","PT006","E741","PLW0108","DTZ"] }

# Пороги на УРОВНЕ ФУНКЦИИ. Плохой код живёт в функциях, а не в файлах: функция
# на 400 строк внутри файла на 480 проходит file-length свободно.
# На легаси эти правила не отключай (иначе сложность не контролируется нигде) —
# включи их и зафиксируй текущее состояние снимком: гейт `complexity` (§3).
[tool.ruff.lint.mccabe]
max-complexity = 10        # цикломатическая сложность (C901)

[tool.ruff.lint.pylint]
max-args = 8               # PLR0913 — больше 8 параметров = скрытый объект
max-branches = 12          # PLR0912
max-returns = 6            # PLR0911
max-statements = 50        # PLR0915 — длина функции в операторах
max-nested-blocks = 4      # PLR1702 — вложенность блоков (preview: гейт зовёт ruff с --preview)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# --- pytest: СТРОГИЙ РАНТАЙМ ---------------------------------------------------
# Дешевле любого гейта и ловит настоящие баги, а не форму: незакрытые ресурсы,
# deprecated-поведение, гонки в корутинах, «работает, но по счастливой случайности».
# Предупреждение, которое никто не читает, — это баг с отложенным сроком.
[tool.pytest.ini_options]
testpaths = ["tests"]
# ⚠ `mutants/` — не косметика, а условие работоспособности сьюта. Мутационный гейт
# (§3, `check_mutation_gate.sh`) оставляет каталог `mutants/` с КОПИЕЙ `tests/`
# внутри, и следующий `pytest` проекта после этого не СОБИРАЕТСЯ: «import file
# mismatch — imported module 'test_calc' has this __file__ … mutants/tests/…»,
# `Interrupted: 1 error during collection`. Замерено с двух сторон: с каталогом —
# ошибка сборки, без него — все тесты проходят. Удалять каталог нельзя: `mutmut
# show <id>` читает его, и это единственный способ увидеть, какое поведение не
# проверено. Поэтому исключение здесь, а не уборка (§3.7).
norecursedirs = ["mutants", ".venv", "node_modules", "build", "dist"]
# `pythonpath` нужен мутационному гейту, а не удобству: pytest внутри `mutants/`
# обязан импортировать МУТИРОВАННУЮ копию пакета, а она лежит рядом с этим файлом
# (§3.7). Значение — «каталог этого конфига», то есть `backend/`.
# Ещё два пути и `addopts` — стражи исполнения (§2.7c): плагин лежит в `scripts/lint/`,
# а из `mutants/` (копия этого файла на уровень глубже) до него на один `..` дальше.
# Второй путь не опечатка: без него mutmut падает импортом плагина, и мутационный
# гейт не судит ничего (замер 21.10, mutmut 3.7). Под mutmut стражи молчат сами.
# Плоская раскладка (конфиг в корне): `"scripts/lint", "../scripts/lint"`. Сам плагин
# грузит `-p run_sentinels` в `addopts` ниже.
pythonpath = [".", "../scripts/lint", "../../scripts/lint"]
# Каждое предупреждение = падение теста. Исключения добавляй ПОШТУЧНО и с причиной
# (это тот же ратчет: список только сокращается).
filterwarnings = [
    "error",
    # ⚠ ПОРЯДОК ВНЕДРЕНИЯ, а не «скопируй и живи». `error` — сильное правило: оно
    # дважды нашло настоящую утечку (`aiosqlite` в трёх тестах, зелёных 24 коммита),
    # и дважды же роняло СБОР тестов на предупреждениях чужих библиотек — то есть
    # падало всё, включая тесты без единой проблемы. Отличие критично: упавший тест
    # виден, упавший сбор выглядит как «проект сломан».
    #
    # Поэтому: включай `error`, прогони сьют ЦЕЛИКОМ и внеси всплывшие чужие
    # предупреждения сюда строкой с апстрим-причиной. Ниже — те, что реально
    # встречались на настоящих проектах; раскомментируй по факту, а не заранее:
    # "ignore:unclosed transport:ResourceWarning:asyncio",
    #
    # ⚠ ФОРМА СТРОКИ: "ignore:<текст сообщения>:<класс>" — ТРИ поля, без модуля.
    # Четвёртое поле (`:<модуль>`) для предупреждений, брошенных НА ИМПОРТЕ чужой
    # библиотеки, не работает никогда: контекстный модуль фильтра — импортирующий
    # файл, а не библиотека, поэтому regex модуля не совпадает. До cqg@1.33 форма
    # здесь была четырёхполевой, и оба примера ниже стояли ровно того вида, который
    # не гасит, — и относились ровно к тем библиотекам, на которых это ломается
    # (starlette.testclient, aiosqlite). Цена ошибки не в минутах отладки:
    # исполнитель, поверивший форме, решает, что `error` в этом проекте неприменим,
    # и снимает сильнейший behaviour-оракул канона. Найдено полевым прогоном lab-9,
    # воспроизведено и на голом CPython, и в pytest.
    # "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
    # "ignore:Please use `aiosqlite.connect`:DeprecationWarning",
    #
    # Модуль в 4-м поле осмыслен только там, где предупреждение бросается ИЗ КОДА
    # библиотеки во время вызова, а не на её импорте (пример с asyncio выше).
    #
    # ⚠ СТРОКА НИЖЕ — РАБОЧАЯ, не пример. pytest с 9.2.0 судит этими фильтрами и
    # `pytest_configure` плагинов, а pytest-asyncio на этом шаге предупреждает, что
    # `asyncio_default_fixture_loop_scope` не объявлен: с `error` pytest не стартует
    # вовсе — INTERNALERROR, ни одного теста. Объявить ключ заранее нельзя: без плагина
    # он неизвестен (капкан у `asyncio_mode` ниже). Нашёл CI канона 14.11. Другой плагин
    # с предупреждением на старте лечится так же: своей строкой здесь, после `error`.
    "ignore:The configuration option .asyncio_default_fixture_loop_scope. is unset:DeprecationWarning",
    # Если сбор падает и причина непонятна — `pytest -W error::UserWarning -x -q`
    # покажет источник; выключать правило целиком нельзя — оно ловит настоящие
    # дефекты (см. следующий абзац о том, какие именно НЕ ловит).
    #
    # ⚠ ЧЕГО `error` НЕ ЛОВИТ, вопреки распространённому чтению (замерено, lab-12):
    # **утечку соединения он ловит МОНЕТКОЙ, а не проверкой.** SAWarning «garbage
    # collector is trying to clean up non-checked-in connection» бросается сборщиком
    # мусора, а GC на утёкшем объекте чаще всего срабатывает уже ПОСЛЕ конца
    # тест-сессии — предупреждение печатается на `sys:1`, когда pytest свой
    # перехват warnings уже снял, и в падение оно не превращается. Отсюда и
    # противоречие двух арок lab-12 на одном и том же дефекте: у одной сьют был
    # зелёным 9 прогонов из 9, у другой краснел — решал тайминг GC, а не наличие
    # течи. Замер: 2 арены × 2 формы утечки × маска ON/OFF × 5 прогонов = **0
    # красных из 40**, при том что течь настоящая (`pool.checkedout() == 1`).
    #
    # Вывод, который стоит держать: `error` — сильный оракул на предупреждения,
    # возникающие ВО ВРЕМЯ теста, и не оракул на то, что всплывает при GC.
    # Детерминированная замена — стражи исполнения (`-p run_sentinels` ниже, §2.7c).
]
# -X dev: включает ResourceWarning, отладочные проверки CPython, asyncio debug.
# Задаётся через env, чтобы работало и в CI, и локально одинаково.
# env = ["PYTHONDEVMODE=1", "PYTHONASYNCIODEBUG=1"]
# ⚠ РАСКОММЕНТИРОВАТЬ ТОЛЬКО ВМЕСТЕ С `pip install pytest-env`. Иначе связка
# `--strict-config` + `filterwarnings = ["error"]` превращает
# `PytestConfigWarning: Unknown config option: env` в исключение, и сбор тестов
# падает с INTERNALERROR — не «предупреждение», а полный отказ. Найдено
# независимым развёртыванием (lab-4): канон дословно предписывал конфиг, который
# не работает без необъявленного плагина. Альтернатива без плагина —
# `PYTHONDEVMODE=1` в env CI-джобы и в pre-push, а не в pyproject.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# ⚠ РАСКОММЕНТИРОВАТЬ ТОЛЬКО ВМЕСТЕ С pytest-asyncio — тот же капкан, что у `env` выше:
# без плагина `--strict-config` строкой ниже делает ключ неизвестным, и pytest не
# стартует вовсе («Unknown config option: asyncio_mode»). Нашёл CI канона 21.10.
# Второй ключ объявляй, как только плагин стоит, — и без `asyncio_mode`: умолчание плагин
# обещает сменить, а без ключа старт держится на строке-исключении в `filterwarnings`, и
# `-W error…` в командной строке сильнее её. Ключ знает плагин от 0.24, со старым — капкан.
addopts = "-q --strict-markers --strict-config -p run_sentinels"   # стражи — §2.7c
xfail_strict = true        # xfail, который вдруг прошёл, = сигнал, а не тишина
# Узел теста с не-ASCII в `ids` pytest печатает экранированным, и второй `pytest.main` в том же
# процессе — так зовёт mutmut — по этому имени его не находит (код 4; pytest 8.4–9.2, свежий
# процесс находит): гейт мутаций не судил ничего (§3.7, `cqg@3.18`). Ключ печатает узел как есть.
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

# --- mypy (чистый strict; НЕ копируй сюда легаси [[overrides]] чужого проекта) -
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
enable_incomplete_feature = ["NewGenericSyntax"]   # PEP 695 generics на mypy < 1.12
explicit_package_bases = true
namespace_packages = true
implicit_reexport = true                            # facade-модули с re-export
exclude = ["migrations/", "tests/", ".venv/", "venv/", "scripts/"]
# Плагина SQLAlchemy здесь нет: в 2.1 модуля `sqlalchemy.ext.mypy` нет, и mypy с ним выходит кодом 2,
# не проверив ни строки (замер 2.1.9, `cqg@3.19`). SQLAlchemy до 2.1 и плагин нужен — допиши его.
plugins = ["pydantic.mypy"]
# Раскладка `src/`: без корня модули зовутся `src.<пакет>.*`, импорт пакета не находится и под
# `ignore_missing_imports` молча становится `Any`. На плоской раскладке каталога нет — ключ
# ничего не меняет (замер mypy 2.4.1).
mypy_path = "src"
ignore_missing_imports = true
follow_imports = "silent"

# --- mutmut: область мутационного гейта ----------------------------------------
# Без этой секции гейт `mutation` (§3) не судит вообще: у 3.x области нет флага, он
# берёт её отсюда. Значение — ИМЯ ПАКЕТА относительно каталога этого файла, а не
# путь от корня репозитория: mutmut выводит ключ мутанта из пути файла, и он обязан
# совпасть с тем, как пакет импортируют тесты. Гейт запускает mutmut из этого
# каталога именно поэтому (§3.7). Свой пакет подставь вместо `app`.
[tool.mutmut]
source_paths = ["src"]

# --- coverage: покрытие src и миграций, ревизии — подпроцессом alembic ------------
# Своё, не фрагмент канона (A107, A108): подпроцесс меряет `patch`, ветки под `run_sync`
# у env.py видны только с гринлетами; файлы подпроцессов pytest-cov сливает сам.
[tool.coverage.run]
source = ["src", "migrations"]
patch = ["subprocess"]
concurrency = ["greenlet", "thread"]
