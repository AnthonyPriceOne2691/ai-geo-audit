# Миграции схемы: `alembic upgrade head` из каталога backend/. Адрес базы — из настроек сервиса
# (DATABASE_URL). Секций журнала здесь нет: env.py пишет в журнал сервиса и fileConfig не зовёт.
[alembic]
script_location = %(here)s/migrations
version_locations = %(here)s/migrations/versions
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC
