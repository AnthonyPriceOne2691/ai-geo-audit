# Боевые отличия поверх основного файла (A89) — накладываются при выкате:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Без наложения основной файл поднимается как прежде. Числа — оценка по замеру стека оракула со
# сверкой с лимитами соседа (decisions Ч1.5в, срез 0); пересчёт — по замеру под нагрузкой, этап
# 1.1. Журнал — journald с меткой сервиса: переживает пересоздание контейнера. Правила наложения —
# `python -m ai_geo_audit.ops.stack_rules --prod` над слитым выводом обоих файлов.
services:
  # Предел соединений: пулы и движки без пула против него считает правило db-connections Части 3.
  db:
    command: ["postgres", "-c", "max_connections=50"]
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: journald
      options:
        tag: ai-geo-audit-db

  # Потолок очереди без вытеснения: полная очередь отказывает в записи явно, а не теряет задачи.
  redis:
    command: ["redis-server", "--maxmemory", "100mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: journald
      options:
        tag: ai-geo-audit-redis

  migrate:
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: journald
      options:
        tag: ai-geo-audit-migrate

  api:
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: journald
      options:
        tag: ai-geo-audit-api

  web:
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: journald
      options:
        tag: ai-geo-audit-web
