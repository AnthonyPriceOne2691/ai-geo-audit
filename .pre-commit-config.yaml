# pre-commit hooks. Установка: pre-commit по манифесту, хуки — заглушкой CQG §5 шаг 5
# (не `pre-commit install`: каталог хуков один на все связанные копии).
# Прогон по всему дереву: pre-commit run --all-files, и ещё раз с --hook-stage pre-push.
#
# Пути ниже — под backend/-и-frontend/-layout (git-root = корень проекта).
# Поправь files:/exclude:/entry: и путь к venv (.venv) под свою структуру.
# Скрипт-хуки читают структуру из env LINT_PY_SRC/LINT_FE_DIR/... (см. §6 документа) —
# задай их здесь ПРЕФИКСОМ или через export, если дефолты не подходят:
#   entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && LINT_PY_SRC=backend/app bash scripts/lint/check_grep_gate.sh --rule config-access'
#   entry: bash -c 'export LINT_PY_SRC=backend/app; cd "$(git rev-parse --show-toplevel)" && bash ...'
# Сверх них проекты чаще всего дописывают (обход флота 26.10, `cqg@2.87`): LINT_TS_SRC — корень TS
# (не задан — $LINT_FE_DIR/src), LINT_LENGTH_GLOBS — маски гейта длины (расширь под них и
# `types_or:` его хука), LINT_JSCPD_TS_EXTS — расширения TS-половины DRY (`.astro`, `.vue`).
# ⚠ Форма `LINT_PY_SRC=... && bash ...` (стояла здесь до cqg@1.28) НЕ работает:
# присваивание без export и с `&&` создаёт переменную ТЕКУЩЕГО шелла, а гейт —
# дочерний процесс, он её не видит. Гейт молча брал дефолт `backend/features`,
# каталога не было, и он печатал мягкий пропуск с exit 0 — зелёный гейт,
# просмотревший ноль файлов. Форма без `bash -c` невозможна в принципе:
# `language: system` делит entry по shlex и делает exec, поэтому `VAR=x` уходит в
# argv[0] и падает FileNotFoundError. Нашло приёмочное развёртывание.

default_install_hook_types: [pre-commit]
# Хук без `stages:` идёт на КАЖДОЙ установленной стадии, а pre-push контур ставит
# сам (§8.5 ③). Без этой строки все гейты коммита повторялись на push — та же
# работа дважды. На push идёт только то, у чего стоит `stages: [pre-push]` (`cqg@2.47`).
default_stages: [pre-commit]
fail_fast: false

repos:
  # -------------------------------------------------------------------------
  # 0. Базовая гигиена: конфиги ОБЯЗАНЫ парситься. Без этого сломанный YAML в
  # .github/workflows/ живёт незамеченным: хостинг не кричит, а показывает
  # workflow путём вместо имени и валит прогон (реальный случай 2026-07-28).
  # Косметические хуки (trailing-whitespace, end-of-file-fixer) сознательно НЕ
  # включены: они трогают все существующие файлы не по теме поставки.
  # Транспорт (адаптация, scripts/lint/adapted.json): те же id и аргументы, но
  # `repo: local` — пакет pre-commit-hooks 6.0.0 из dev-группы uv, по uv.lock (A100).
  # Внешний `repo:` ставит своё окружение и тянет зависимости с PyPI мимо lock.
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-yaml
        name: check yaml
        language: system
        entry: uv run --project backend --no-sync check-yaml
        types: [yaml]
        # Боевое наложение несёт тег compose `!reset` (A181, 6а-2): безопасный разбор его не знает.
        # Синтаксис наложения — следующий хук, смысл — `docker compose config` шага A89 оракула.
        exclude: ^docker-compose\.prod\.yml$
      - id: check-yaml-compose-tags
        name: check yaml — синтаксис боевого наложения с тегами compose
        language: system
        entry: uv run --project backend --no-sync check-yaml --unsafe
        files: ^docker-compose\.prod\.yml$
      - id: check-json
        name: check json
        language: system
        entry: uv run --project backend --no-sync check-json
        types: [json]
      - id: check-toml
        name: check toml
        language: system
        entry: uv run --project backend --no-sync check-toml
        types: [toml]
      - id: check-merge-conflict
        name: check for merge conflicts
        language: system
        entry: uv run --project backend --no-sync check-merge-conflict
        types: [text]
      - id: check-added-large-files
        name: check for added large files
        language: system
        entry: uv run --project backend --no-sync check-added-large-files
        stages: [pre-commit, pre-push, manual]
        args: [--maxkb=512]

  # -------------------------------------------------------------------------
  # Вариант D (AGENT_STACK §7.1a): тексты контура в git не кладутся. Строки
  # `.git/info/exclude` в новый клон не приезжают, а этот хук приезжает (A97).
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: canon-texts-stay-out
        name: тексты контура не коммитятся (вариант D)
        language: fail
        entry: "тексты контура в git не кладутся: git rm --cached ПУТЬ, снимок — git rm -r --cached docs/canon (AGENT_STACK §7.1a)"
        files: ^(AGENT_STACK|AGENT_DELIVERY_HARNESS|CODE_QUALITY_GATES|OKF_KNOWLEDGE_BUNDLE)\.md$|^(stack_selftest|selftest_sizes|extract_payload)\.py$|^docs/canon/

  # -------------------------------------------------------------------------
  # Python: ruff (lint + format) — под backend, ИЗ VENV ПРОЕКТА (`cqg@2.55`).
  # Прежде здесь стоял `astral-sh/ruff-pre-commit` со своим `rev:`, а CI,
  # pre-push и редактор брали ruff из lock проекта: две версии одного
  # инструмента по построению. Поле outreach 07.10: rev v0.15.13 против 0.16.9
  # в lock — `noqa: BLE001` одна версия требовала, другая отвергала как
  # RUF100. Версия теперь одна, из lock; venv ищется лестницей хука mypy ниже.
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      # ⚠ `exclude:` держится ОТДЕЛЬНО от `files:`, и это не дубль. `files:`
      # проект правит под свою раскладку — это прямо разрешено шапкой выше, и
      # на стеке без `backend/` его снимают целиком. Тогда линтер добирается до
      # payload'а КОНТУРА: этот код проект не писал, чинить его не может (он
      # приезжает перевендориванием), а `ruff-format` ещё и перепишет тело —
      # снимок разойдётся с каноном, и доктор объявит адаптацию, которой не
      # делали. Замер: `lash-try-on` снял `files:` (python у него не под
      # backend) и получил четыре ошибки ruff на `scripts/delivery_status.py`
      # плюс переписанные косметическими хуками файлы снимка.
      # Судит payload его владелец — сьют канона (`test_payload_passes_own_gates`).
      # ⚠ `files:` шире `backend/` не делай: у файла вне каталога своего конфига ruff молча
      # судит умолчаниями (первый проект на `cqg@3.14`: `os.system` в `deploy/` прошёл) —
      # python вне backend судит хук-близнец с `--config` (CQG §5 шаг 2).
      - id: ruff
        name: ruff check (версия из lock проекта)
        language: system
        types_or: [python, pyi]
        require_serial: true
        entry: |-
          bash -c 'R="$(git rev-parse --show-toplevel)" || exit 1; B="${LINT_BE_DIR:-backend}"; V="${LINT_VENV:-.venv}"; X=""; for c in "$R/$B/$V/bin/ruff" "$R/$V/bin/ruff" "$R/$B/.venv/bin/ruff"; do [ -x "$c" ] && { X="$c"; break; }; done; [ -n "$X" ] || { printf "\033[31mruff не найден — искал %s и %s. Версия хука — из lock проекта (cqg@2.55); правится LINT_VENV / LINT_BE_DIR или установкой ruff в venv проекта\033[0m\n" "$B/$V/bin/ruff" "$V/bin/ruff"; exit 1; }; exec "$X" check --force-exclude --fix --exit-non-zero-on-fix "$@"' --
        files: ^backend/
        exclude: ^(docs/canon/|scripts/(lint/|merge_guard\.sh|delivery_|okf_))
      - id: ruff-format
        name: ruff format (версия из lock проекта)
        language: system
        types_or: [python, pyi]
        require_serial: true
        entry: |-
          bash -c 'R="$(git rev-parse --show-toplevel)" || exit 1; B="${LINT_BE_DIR:-backend}"; V="${LINT_VENV:-.venv}"; X=""; for c in "$R/$B/$V/bin/ruff" "$R/$V/bin/ruff" "$R/$B/.venv/bin/ruff"; do [ -x "$c" ] && { X="$c"; break; }; done; [ -n "$X" ] || { printf "\033[31mruff не найден — искал %s и %s. Версия хука — из lock проекта (cqg@2.55); правится LINT_VENV / LINT_BE_DIR или установкой ruff в venv проекта\033[0m\n" "$B/$V/bin/ruff" "$V/bin/ruff"; exit 1; }; exec "$X" format --force-exclude "$@"' --
        files: ^backend/
        exclude: ^(docs/canon/|scripts/(lint/|merge_guard\.sh|delivery_|okf_))

  # -------------------------------------------------------------------------
  # Python: mypy strict через проектный venv (local hook, НЕ mirrors-mypy: у того
  # изолированное venv без проектных плагинов/модулей).
  #
  # ⚠ ОДИН вызов на пакет, `pass_filenames: false`. Раньше здесь стоял per-file
  # прогон, и pre-commit разбивал файлы на пачки: на большом дереве (84 файла)
  # mypy падал INTERNAL ERROR на второй пачке, тогда как первая печатала
  # «Success». Причины две, обе неприятные: mypy на пачках теряет часть графа
  # импортов, а краш ОБРЫВАЕТ джобу — шаги ниже не выполняются вовсе.
  # Один прогон по пакету медленнее на коммите, но воспроизводим и кэшируется.
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: mypy
        name: mypy strict (весь пакет, один вызов)
        language: system
        files: ^(backend/.*\.py|pyproject\.toml|setup\.cfg|\.pre-commit-config\.yaml|scripts/lint/.*)$
        exclude: /tests/
        # Имя пакета — из env, как все остальные пути (§6). До cqg@1.37 здесь
        # стояло вшитое `features`, и на проекте с пакетом `app` хук падал
        # `Cannot read file 'features'`. Само по себе это диагностируется по §6,
        # но контраст «пути настраиваются через env» против «этот путь inline»
        # стоил неверного диагноза: сводка «mypy strict … Failed» читалась как
        # ошибки типов (развёртывание 2026-07-31, дефект прочтения, не механики).
        #
        # ⚠ `LINT_VENV` разрешается ПО КАНДИДАТАМ, как в четырёх скриптах гейтов, —
        # находка 5 первого развёртывания. §6 обещает, что значение принимается и
        # относительно backend, и от repo-root («скрипты разрешают оба написания»),
        # но этот entry делал `cd backend` и брал значение уже ОТТУДА: разрешённое
        # `backend/.venv` давало `backend/backend/.venv/bin/mypy` и **exit 127
        # сырой ошибкой шелла**. Читается как поломка окружения, а не как
        # расхождение канона с самим собой. Третий кандидат — venv в корне репо
        # (тот же layout, что разрешают гейты). Инструмента нет — причина
        # НАЗЫВАЕТСЯ, включая переменную, которой это правится: чужие слова
        # («command not found») отправляют чинить не туда. Держит
        # `TestMypyHookHonoursBothVenvSpellings`, включая обратный прогон.
        entry: |-
          bash -c 'export LINT_COV_PKG="src/ai_geo_audit"; R="$(git rev-parse --show-toplevel)" || exit 1; B="${LINT_BE_DIR:-backend}"; V="${LINT_VENV:-.venv}"; M=""; for c in "$R/$B/$V/bin/mypy" "$R/$V/bin/mypy" "$R/$B/.venv/bin/mypy"; do [ -x "$c" ] && { M="$c"; break; }; done; [ -n "$M" ] || { printf "\033[31mmypy не найден — искал %s и %s. LINT_VENV принимается и относительно %s, и от repo-root (§6); правится LINT_VENV / LINT_BE_DIR или установкой mypy в venv проекта\033[0m\n" "$B/$V/bin/mypy" "$V/bin/mypy" "$B"; exit 1; }; cd "$R/$B" || exit 1; "$M" --config-file pyproject.toml "${LINT_COV_PKG:-features}"'
        pass_filenames: false

      # Код выката и свои скрипты вне backend/ — под те же ruff и mypy strict, что сервис:
      # `deploy/` работает от root на общем сервере (решение проверяющего 2026-11-20T09:26Z). У файла
      # вне backend/ ruff своего конфига не найдёт и молча возьмёт умолчания — конфиг передаётся
      # явно. Свой скрипт попадает сюда сам — любой `.py` в `scripts/` и `deploy/`; тела канона
      # (`scripts/lint/`, `scripts/delivery_*`, `scripts/okf_*`) — нет. Свой файл под исключением
      # или тело канона под хуком — красный тест контракта: перечень тел — замок payload.
      - id: ruff-deploy
        name: ruff check — deploy/ и свои скрипты (конфиг backend)
        language: system
        types_or: [python, pyi]
        require_serial: true
        files: ^(deploy|scripts)/.*\.py$
        exclude: ^scripts/(lint/.*|delivery_[a-z_]+|okf_[a-z_]+)\.py$
        entry: bash -c 'R="$(git rev-parse --show-toplevel)" || exit 1; X="$R/backend/.venv/bin/ruff"; [ -x "$X" ] || { printf "\033[31mruff не найден — %s; cd backend && uv sync --frozen\033[0m\n" "$X"; exit 1; }; exec "$X" check --config "$R/backend/pyproject.toml" --force-exclude --fix --exit-non-zero-on-fix "$@"' --
      - id: ruff-format-deploy
        name: ruff format — deploy/ и свои скрипты (конфиг backend)
        language: system
        types_or: [python, pyi]
        require_serial: true
        files: ^(deploy|scripts)/.*\.py$
        exclude: ^scripts/(lint/.*|delivery_[a-z_]+|okf_[a-z_]+)\.py$
        entry: bash -c 'R="$(git rev-parse --show-toplevel)" || exit 1; X="$R/backend/.venv/bin/ruff"; [ -x "$X" ] || { printf "\033[31mruff не найден — %s; cd backend && uv sync --frozen\033[0m\n" "$X"; exit 1; }; exec "$X" format --config "$R/backend/pyproject.toml" --force-exclude "$@"' --
      - id: mypy-deploy
        name: mypy strict — deploy/ и свои скрипты (конфиг backend)
        language: system
        types_or: [python, pyi]
        require_serial: true
        files: ^(deploy|scripts)/.*\.py$
        exclude: ^scripts/(lint/.*|delivery_[a-z_]+|okf_[a-z_]+)\.py$
        entry: bash -c 'R="$(git rev-parse --show-toplevel)" || exit 1; M="$R/backend/.venv/bin/mypy"; [ -x "$M" ] || { printf "\033[31mmypy не найден — %s; cd backend && uv sync --frozen\033[0m\n" "$M"; exit 1; }; F=(); for f in "$@"; do case "$f" in /*) F+=("$f");; *) F+=("$R/$f");; esac; done; cd "$R/backend" || exit 1; exec "$M" --config-file pyproject.toml "${F[@]}"' --

  # -------------------------------------------------------------------------
  # TypeScript / React: ESLint (per-file errors) + warning-ратчет + Prettier —
  # поставка В1б (адаптация, scripts/lint/adapted.json): npm в CI В1а нет, а
  # `npx --no-install` без node_modules красит любой прогон. Роль ратчета
  # предупреждений объявлена в scripts/lint/not-applicable.json с причиной.
  # -------------------------------------------------------------------------

  # -------------------------------------------------------------------------
  # Файлы кода: prod <= 500 / tests <= 1000 строк (baseline-ratchet).
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: file-length
        name: Файлы кода <= 500/1000 строк (baseline-ratchet)
        language: system
        entry: bash -c 'export LINT_LENGTH_GLOBS="*.py *.ts *.tsx *.mjs"; cd "$(git rev-parse --show-toplevel)" && bash scripts/lint/check_file_length.sh'
        types_or: [python, ts, tsx, javascript]
        pass_filenames: false

  # -------------------------------------------------------------------------
  # Греп-гейты конвенций (per-file baseline-ratchet).
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      # -----------------------------------------------------------------------
      # ⚠ files: у гейтов ниже включает и КОНФИГИ, не только код. Причина: с маской
      # `^backend/.*\.py$` коммит, меняющий `pyproject.toml`, `.pre-commit-config.yaml`
      # или снимок в `scripts/lint/`, не запускал ни одного гейта — то есть правка
      # САМИХ ПОРОГОВ порогами не проверялась. Нашли два развёртывания независимо.
      # Бюджет §8.6 не страдает: такие коммиты редки, у гейтов `pass_filenames: false`,
      # и на обычной правке кода маска работает как раньше.
      # -----------------------------------------------------------------------
      - id: config-access-gate
        name: config-access — типизированный config.X, не getattr/os.getenv
        language: system
        entry: bash -c 'export LINT_PY_SRC="backend"; cd "$(git rev-parse --show-toplevel)" && bash scripts/lint/check_grep_gate.sh --rule config-access'
        files: ^(backend/.*\.py|pyproject\.toml|setup\.cfg|\.pre-commit-config\.yaml|scripts/lint/.*)$
        pass_filenames: false
      - id: di-indirection-gate
        name: di-indirection — без pkg/session/ctx Any и importlib reach-back
        language: system
        entry: bash -c 'export LINT_PY_SRC="backend"; cd "$(git rev-parse --show-toplevel)" && bash scripts/lint/check_grep_gate.sh --rule di-indirection'
        files: ^(backend/.*\.py|pyproject\.toml|setup\.cfg|\.pre-commit-config\.yaml|scripts/lint/.*)$
        pass_filenames: false
      - id: service-no-web-gate
        name: service-no-web — сервис-слой не импортирует web-фреймворк
        language: system
        entry: bash -c 'export LINT_PY_SRC="backend"; cd "$(git rev-parse --show-toplevel)" && bash scripts/lint/check_grep_gate.sh --rule service-no-web'
        files: ^(backend/.*\.py|pyproject\.toml|setup\.cfg|\.pre-commit-config\.yaml|scripts/lint/.*)$
        pass_filenames: false
      - id: no-grab-bag-module-gate
        name: no-grab-bag — utils/misc/common/helpers.py без темы запрещены
        language: system
        entry: bash -c 'export LINT_PY_SRC="backend"; cd "$(git rev-parse --show-toplevel)" && bash scripts/lint/check_grep_gate.sh --rule no-grab-bag-module'
        files: ^(backend/.*\.py|pyproject\.toml|setup\.cfg|\.pre-commit-config\.yaml|scripts/lint/.*)$
        pass_filenames: false
      # ⚠ Интерпретатор РЕЗОЛВИТСЯ лестницей, а не берётся вслепую. Зашитый
      # `backend/.venv/bin/python` отказывает там, где venv лежит не по канонному
      # пути: `bash: backend/.venv/bin/python: No such file or directory` — гейт
      # не судит, а ОТКАЗЫВАЕТ, и четыре правила молчат разом. Замер
      # `outreach-donors` 30.09 (venv и pyproject в корне). Тот же приём и по той
      # же причине уже стоит у хука mypy и в `merge_guard.sh`; сюда он перенесён
      # не был — третий рецидив одного класса, и первый, найденный раскаткой.
      - id: silent-except-gate
        name: silent-except — broad-except без raise/лога (AST)
        language: system
        entry: bash -c 'export LINT_PY_SRC="backend/src"; cd "$(git rev-parse --show-toplevel)" || exit 1; P=""; for c in "${LINT_BE_DIR:-backend}/${LINT_VENV:-.venv}/bin/python" "${LINT_VENV:-.venv}/bin/python" "backend/.venv/bin/python"; do [ -x "$c" ] && { P="$c"; break; }; done; [ -n "$P" ] || P="$(command -v python3)"; "$P" scripts/lint/check_ast_gate.py --rule silent-except'
        files: ^(backend/.*\.py|pyproject\.toml|setup\.cfg|\.pre-commit-config\.yaml|scripts/lint/.*)$
        pass_filenames: false
      - id: inline-prompt-gate
        name: inline-prompt — LLM-промпт инлайном в .py (AST)
        language: system
        entry: bash -c 'export LINT_PY_SRC="backend/src"; cd "$(git rev-parse --show-toplevel)" || exit 1; P=""; for c in "${LINT_BE_DIR:-backend}/${LINT_VENV:-.venv}/bin/python" "${LINT_VENV:-.venv}/bin/python" "backend/.venv/bin/python"; do [ -x "$c" ] && { P="$c"; break; }; done; [ -n "$P" ] || P="$(command -v python3)"; "$P" scripts/lint/check_ast_gate.py --rule inline-prompt'
        files: ^(backend/.*\.py|pyproject\.toml|setup\.cfg|\.pre-commit-config\.yaml|scripts/lint/.*)$
        pass_filenames: false
      - id: cpu-in-async-gate
        name: cpu-in-async — разбор/регулярка в цикле внутри async def (AST)
        language: system
        entry: bash -c 'export LINT_PY_SRC="backend/src"; cd "$(git rev-parse --show-toplevel)" || exit 1; P=""; for c in "${LINT_BE_DIR:-backend}/${LINT_VENV:-.venv}/bin/python" "${LINT_VENV:-.venv}/bin/python" "backend/.venv/bin/python"; do [ -x "$c" ] && { P="$c"; break; }; done; [ -n "$P" ] || P="$(command -v python3)"; "$P" scripts/lint/check_ast_gate.py --rule cpu-in-async'
        files: ^(backend/.*\.py|pyproject\.toml|setup\.cfg|\.pre-commit-config\.yaml|scripts/lint/.*)$
        pass_filenames: false

  # -------------------------------------------------------------------------
  # DRY / copy-paste гейт (jscpd clone-count ratchet).
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: unbounded-list-gate
        name: unbounded-list — эндпоинт отдаёт список без границы (AST)
        language: system
        entry: bash -c 'export LINT_PY_SRC="backend/src"; cd "$(git rev-parse --show-toplevel)" || exit 1; P=""; for c in "${LINT_BE_DIR:-backend}/${LINT_VENV:-.venv}/bin/python" "${LINT_VENV:-.venv}/bin/python" "backend/.venv/bin/python"; do [ -x "$c" ] && { P="$c"; break; }; done; [ -n "$P" ] || P="$(command -v python3)"; "$P" scripts/lint/check_ast_gate.py --rule unbounded-list'
        files: ^(backend/.*\.py|pyproject\.toml|setup\.cfg|\.pre-commit-config\.yaml|scripts/lint/.*)$
        pass_filenames: false

  # -------------------------------------------------------------------------
  # DRY / copy-paste гейт (jscpd clone-count ratchet).
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: jscpd-dry-gate
        name: DRY — рост копипаста (jscpd clone-count ratchet)
        language: system
        entry: bash -c 'export LINT_PY_SRC="backend/src"; cd "$(git rev-parse --show-toplevel)" && bash scripts/lint/check_jscpd_gate.sh'
        # TS — каталогом: расширения решают гейт и проект (по умолчанию и `.mts/.cts`, `.astro` дописывают).
        files: ^(backend/.*\.py|frontend/src/.*|pyproject\.toml|setup\.cfg|\.pre-commit-config\.yaml|scripts/lint/.*)$
        pass_filenames: false

  # -------------------------------------------------------------------------
  # import-linter — направление зависимостей между слоями.
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: layers-gate
        name: layers — направление зависимостей (import-linter / dependency-cruiser)
        language: system
        entry: bash scripts/lint/check_layers_gate.sh
        # Область — пакет продукта backend/src и конфиг слоёв в backend/ (адаптация,
        # scripts/lint/adapted.json); frontend/src — с TS-половиной, поставка В1б.
        files: ^(backend/src/.*\.py|backend/\.importlinter|\.importlinter|\.dependency-cruiser\..*|pyproject\.toml|setup\.cfg|\.pre-commit-config\.yaml|scripts/lint/.*)$
        pass_filenames: false

  # -------------------------------------------------------------------------
  # Функции и диагностируемость: сложность на уровне функции (плохой код живёт
  # там, а не в файле) и сообщения ошибок с контекстом (§2.4a).
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      # `pass_filenames: false`: гейт судит всё дерево, а `files:` решает лишь, пойдёт
      # ли он. Половина без маски не запускала его на коммите — правка одного `.tsx`
      # видела «Skipped» (`cqg@2.53`, поле outreach #201). То же у jscpd выше.
      # Маска — всё, что судит ИНСТРУМЕНТ (`cqg@2.86`): ruff берёт и `.pyi`/`.ipynb`, eslint —
      # `.js/.mjs/.cjs` всегда и то, что назовёт конфиг проекта (`.astro`). Поэтому TS-половина —
      # каталогом: с расширениями правка одного `.mjs` давала «Skipped», а CI её судит.
      - id: complexity-gate
        name: function complexity ratchet (C901/PLR09xx)
        entry: bash -c 'export LINT_PY_SRC="backend/src"; cd "$(git rev-parse --show-toplevel)" && bash scripts/lint/check_complexity_gate.sh'
        language: system
        files: ^(backend/.*\.(py|pyi|ipynb)|frontend/src/.*|pyproject\.toml|setup\.cfg|\.pre-commit-config\.yaml|scripts/lint/.*)$
        pass_filenames: false

      - id: blind-error
        name: error messages carry context
        entry: bash -c 'export LINT_PY_SRC="backend"; cd "$(git rev-parse --show-toplevel)" && bash scripts/lint/check_grep_gate.sh --rule blind-error'
        language: system
        files: ^(backend/.*\.py|pyproject\.toml|setup\.cfg|\.pre-commit-config\.yaml|scripts/lint/.*)$
        pass_filenames: false
      - id: unstructured-log
        name: logs are structured (searchable by field)
        entry: bash -c 'export LINT_PY_SRC="backend"; cd "$(git rev-parse --show-toplevel)" && bash scripts/lint/check_grep_gate.sh --rule unstructured-log'
        language: system
        files: ^(backend/.*\.py|pyproject\.toml|setup\.cfg|\.pre-commit-config\.yaml|scripts/lint/.*)$
        pass_filenames: false

  # deps-audit и mutation — НЕ на commit (§8.6: бюджет 5 с). deps-audit ходит в
  # сеть, mutation считает минуты. Их место — CI и pre-push.
  - repo: local
    hooks:
      # -----------------------------------------------------------------------
      # Secrets. §2.7 посылала за этим блоком «в конец Приложения B», а блока здесь
      # НЕ БЫЛО — он жил только в прозе §2.7. Кто копировал конфиг дословно (а канон
      # требует именно дословно), получал контур без secrets-хука, при том что
      # строка приёмки §6 «Нет секретов в git» помечена `auto`. Три независимых
      # развёртывания нашли это по отдельности. Альтернатива — gitleaks, см. §2.7.
      # -----------------------------------------------------------------------
      - id: detect-secrets-guard
        name: secrets — ничего секретного в коммит (§2.7)
        language: system
        # entry блочным скаляром `|-`, а НЕ plain: в тексте есть «Установка: pip …»,
        # а последовательность `": "` внутри plain-скаляра YAML запрещена и роняет
        # разбор ВСЕГО файла — pre-commit не стартует ни одним хуком. Именно так и
        # вышло при добавлении этого хука; поймал приёмочный прогон, а не
        # самопроверка, потому что PyYAML на машине правившего не стоял.
        #
        # lab-11 F10: хук печатал `Passed`, не просканировав НИ ОДНОГО файла —
        # голый `command -v` не видел инструмента в venv проекта, а «инструмента
        # нет» выходил нулём. Единственный хук с голым PATH был ровно тот, для
        # которого §6 запрещает soft-режим. Теперь: ① инструмент ищется СНАЧАЛА
        # в venv (как у mypy-соседа), потом в PATH; ② инструмента нет + weak НЕ
        # объявлен в STATUS = exit 1 — наказывается ложь, а не бедность (тот же
        # принцип, что check_ci_status.sh); ③ успех печатает число просмотренных
        # (§6: «чисто» обязано отличаться от «ноль файлов»); ④ нет baseline при
        # живом инструменте = exit 1 с командой снятия.
        #
        # ⚠ Сообщения ниже пишут «secrets — …», а НЕ «secrets: …», и это не стиль.
        # Замер (первое развёртывание, находка 2): detect-secrets на yaml-файле
        # относит находку к строке `entry: |-`, а его KeywordDetector считает
        # секретом всё, что стоит после `secret…:` — то есть текст СВОЕГО ЖЕ
        # сообщения. Конфиг канона краснил у собственного хука. Двоеточие после
        # слова из denylist'а (`secret`, `password`, `token`, `api_key`) внутри
        # этого entry запрещено; регрессия — `tests/test_payload_clean_for_scanners.py`.
        entry: |-
          bash -c 'cd "$(git rev-parse --show-toplevel)" || exit 1; t=""; for c in "${LINT_VENV:-backend/.venv}/bin/detect-secrets-hook" "${LINT_BE_DIR:-backend}/.venv/bin/detect-secrets-hook" ".venv/bin/detect-secrets-hook"; do [ -x "$c" ] && { t="$c"; break; }; done; [ -n "$t" ] || t="$(command -v detect-secrets-hook || true)"; if [ -n "$t" ]; then [ -f .secrets.baseline ] || { printf "\033[31msecrets — baseline отсутствует. Сними его (порядок §5 шага 11: сначала git add): detect-secrets scan \$(git ls-files -c -o --exclude-standard) > .secrets.baseline\033[0m\n"; exit 1; }; "$t" --baseline .secrets.baseline "$@" || exit 1; printf "secrets — просканировано %d файл(ов)\n" "$#"; else if grep -qsiE "security-oracles:.*weak" delivery/active/STATUS.md; then printf "\033[33m⚠ detect-secrets не установлен; security-oracles: weak объявлен в STATUS — бедность названа, не спрятана (§2.7)\033[0m\n"; else printf "\033[31msecrets — инструмента НЕТ, а weak НЕ объявлен — гейт не смеет молча выйти нулём (lab-11 F10). Выходы: pip install detect-secrets (он в requirements-dev.txt шага 4) ИЛИ объяви security-oracles: weak в delivery/active/STATUS.md\033[0m\n"; exit 1; fi; fi' --
        pass_filenames: true

      # ⚠ ЗАМЕР, а не мнение: `deps-audit` один даёт ~24 с (ходит в сеть за базой
      # уязвимостей), при бюджете pre-push ≤10 с (§8.6). Восьмое развёртывание
      # намерило 24.5 с против 0.04 с без него — то есть весь перебор бюджета давал
      # он. Хук, вылезший за бюджет, начинают обходить (`--no-verify`), и тогда не
      # работает ни он, ни соседи. Поэтому по умолчанию гейт **CI-only**: в
      # `quality.yml` он обязателен, а на pre-push включается строкой ниже — только
      # если проект замерил и уложился (кэш индекса, офлайн-база).
      #   stages: [pre-push]
      - id: deps-audit
        name: no new vulnerable dependencies (CI-only по бюджету §8.6)
        entry: bash scripts/lint/check_deps_audit.sh
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true

      # Мёртвый код — на pre-push, а не на коммите, и это замер (§3.8): гейт читает ВСЁ
      # дерево — до 5 с на проект при бюджете коммита 5 с на все хуки (§8.6). Дубль —
      # шаг `quality.yml`: хук обходится `--no-verify`. Питон — лестницей, как у AST-гейтов:
      # правила разбирают код проекта его же интерпретатором.
      - id: dead-code
        name: dead code — объявлено и никем не зовётся (ратчет, pre-push)
        language: system
        entry: bash -c 'export LINT_PY_SRC="backend/src"; cd "$(git rev-parse --show-toplevel)" || exit 1; P=""; for c in "${LINT_BE_DIR:-backend}/${LINT_VENV:-.venv}/bin/python" "${LINT_VENV:-.venv}/bin/python" "backend/.venv/bin/python"; do [ -x "$c" ] && { P="$c"; break; }; done; [ -n "$P" ] || P="$(command -v python3)"; "$P" scripts/lint/check_dead_code.py'
        stages: [pre-push]
        pass_filenames: false
      # ⚠ База — ЦЕЛЬ МЕРЖА, а не upstream ветки, и это стоило отказа правила на
      # живом проекте (`cqg@2.05`). Прежняя редакция брала `@{u}`: пока ветка не
      # запушена, это цель мержа и всё верно, а ПОСЛЕ первого push'а `@{u}` — сама
      # ветка, и «дифф поставки» схлопывается в последний инкремент. Замер:
      # по цели мержа 27 файлов и 8 цитат в блоке ревью, по `@{u}` — 1 файл и 0
      # цитат при пороге §12.5 «≥2». Порог становится недостижим АРИФМЕТИЧЕСКИ:
      # чинить нечего, а пройти нельзя — это не строгость, а отказ.
      # И второе: тот же блок в CI судится против цели мержа и зелёный, то есть
      # два оракула одного правила расходились по базе, причём локальный был
      # строже там, где прав был CI. Базу обязаны брать одинаково — держит оракул.
      - id: delivery-gate
        name: delivery phase gate + breakers (pre-push)
        entry: bash -c 'b(){ git symbolic-ref --quiet --short refs/remotes/origin/HEAD 2>/dev/null && return 0; for c in origin/main origin/master; do git rev-parse --verify --quiet "$c" >/dev/null 2>&1 && { echo "$c"; return 0; }; done; echo origin/main; }; PY=$(command -v python3 || command -v python); "$PY" scripts/delivery_check.py --diff-base "$(b)"'
        language: system
        stages: [pre-push]
        pass_filenames: false
      - id: baseline-ratchet
        name: baseline only melts (pre-push)
        entry: bash scripts/lint/check_baseline_ratchet.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
      # Гейт, который исполняется только в CI, — не автоматика, а украшение: на
      # проекте без раннера он не срабатывал НИ РАЗУ (lab-12). Замер: 0.06 c на
      # манифест — бюджет §8.6 (≤10 c) он не трогает. База — та же ЦЕЛЬ МЕРЖА, что
      # у delivery-gate: вопрос «вносит ли ПОСТАВКА необъявленную зависимость», а
      # не «внёс ли её последний push». По `@{u}` зависимость, добавленную первым
      # push'ом, следующие уже не видят — и объявление можно снять из STATUS
      # безнаказанно.
      - id: new-dependency
        name: новая зависимость объявлена в STATUS (pre-push)
        entry: bash -c 'b(){ git symbolic-ref --quiet --short refs/remotes/origin/HEAD 2>/dev/null && return 0; for c in origin/main origin/master; do git rev-parse --verify --quiet "$c" >/dev/null 2>&1 && { echo "$c"; return 0; }; done; echo origin/main; }; PY=$(command -v python3 || command -v python); BASE="$(b)" "$PY" scripts/lint/check_new_dependency.py'
        language: system
        stages: [pre-push]
        pass_filenames: false

  # Мета-гейт — ПОСЛЕДНИМ. Проверяет, что все гейты выше вообще подключены:
  # забытый в этом файле скрипт молча не работает (§3, gate-coverage).
  - repo: local
    hooks:
      - id: gate-coverage
        name: every gate script is wired into pre-commit/CI
        entry: bash scripts/lint/check_gate_coverage.sh
        language: system
        pass_filenames: false
        always_run: true
