name: quality

# Шаблон канона cqg@3.30 с адаптациями — scripts/lint/adapted.json, запись `.github/workflows/quality.yml`.
# Правила этого файла держит тест контракта backend/tests/test_ci_contract.py (A99–A101, A103, A123).
on:
  pull_request:
  push:
    branches: [main]

# Токен прогона — только чтение (A100); записи не нужно ни одной джобе.
permissions:
  contents: read

# Устаревший прогон отменяется только у запроса на слияние; у main группа — по хешу коммита,
# и каждый прогон идёт до конца (A101).
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STRICT: "1"                 # мягкий режим в CI запрещён (Delivery §10.4)
  LINT_BE_DIR: backend
  LINT_FE_DIR: frontend
  LINT_PY_SRC: "backend/src"  # как у хуков гейтов, которые зовутся здесь напрямую (A99)
  LINT_COV_PKG: "src/ai_geo_audit"
  LINT_LENGTH_GLOBS: "*.py *.ts *.tsx *.mjs"

jobs:
  gates:
    runs-on: ubuntu-24.04
    # §8.7: предохранитель, а не оптимизация — гейты идут минуты; 20 значит «что-то повисло».
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0              # база диффа: ратчет снимков и новые зависимости
          persist-credentials: false  # токен не остаётся в .git/config (A100)
      # §8.3a: база диффа — одна на джобу, отказ — вслух; тихого фолбэка на HEAD нет (A104).
      - name: Diff base (одна на джобу, отказ — вслух)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            before="${{ github.event.before }}"
            zero="0000000000000000000000000000000000000000"
            if [ -n "$before" ] && [ "$before" != "$zero" ] \
               && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              base="$before"
            else
              default="${{ github.event.repository.default_branch }}"
              base="$(git merge-base "origin/$default" HEAD 2>/dev/null || true)"
              if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
                echo "::error::база диффа не определима (before=$before, default=$default):"\
                     "первый push репозитория или переписанная история." \
                     "Открой PR или сделай второй коммит — гейт не имеет права судить пустоту."
                exit 1
              fi
            fi
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "база диффа: $base"

      # Версия — минор из requires-python (A99).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # Инструменты гейтов — dev-группа uv из замка, те же версии, что на машине (A99, A123).
      - name: Инструменты из замка
        run: |
          python -m pip install uv==0.11.26
          cd backend && uv sync --frozen

      # Пропуск гейта из-за неставшего инструмента в CI — красное, а не «честный пропуск» (§8.3).
      - name: Инструменты гейтов на месте (иначе пропуск читается как успех)
        run: |
          missing=""
          expect() { [ -x "backend/.venv/bin/$1" ] || missing="$missing $1"; }
          expect detect-secrets; expect ruff; expect mypy; expect pip-audit
          expect mutmut; expect vulture; expect lint-imports
          if [ -n "$missing" ]; then
            echo "::error::инструменты гейтов не поставились:$missing"
            echo "Гейты ниже уйдут в честный пропуск, и джоба будет ВЫГЛЯДЕТЬ проверенной."
            exit 1
          fi
          echo "toolchain: на месте — detect-secrets ruff mypy pip-audit mutmut vulture lint-imports"

      # `--verbose`: без него pre-commit глотает «просмотрено N» прошедших хуков (A98).
      - name: pre-commit (all files, STRICT=1)
        run: uv run --project backend --no-sync pre-commit run --all-files --show-diff-on-failure --verbose

      # `if: always()` у каждого независимого гейта: упавший шаг не уносит гейты за собой.
      - name: Gate coverage (все гейты подключены)
        if: always()
        run: bash scripts/lint/check_gate_coverage.sh

      # Объявления n/a — с причиной на каждом прогоне: мета-гейт печатает только целые скрипты и
      # правила греп-гейта, половины `имя:ts` — нет (находка проверяющей 2026-11-20).
      - name: Объявления n/a с причинами
        if: always()
        run: >-
          python3 -I -c 'import json, pathlib;
          d = json.loads(pathlib.Path("scripts/lint/not-applicable.json").read_text("utf-8"));
          print(*(f"n/a {k}: {v}" for k, v in d.items() if k != "_"), sep="\n")'

      - name: Contour doctor (гейты не только вписаны, но и судят)
        if: always()
        run: python3 scripts/lint/contour_doctor.py

      - name: Baseline ratchet (снимки только вниз)
        if: always()
        run: bash scripts/lint/check_baseline_ratchet.sh

      - name: New dependency declared
        if: always()
        run: python scripts/lint/check_new_dependency.py

      - name: Dead code (ratchet)
        if: always()
        run: python scripts/lint/check_dead_code.py

      # JS-половина — поставка В1б: шаг смотрит фронт в несуществующий каталог (A99, A102).
      # Python-половина, не проверенная по любой причине, — красное (A103).
      - name: Vulnerable dependencies (python; JS — поставка В1б)
        if: always()
        env:
          LINT_FE_DIR: .frontend-not-here
        run: |
          set +e
          out=$(bash scripts/lint/check_deps_audit.sh 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -q "python-зависимости не проверены"; then
            echo "::error::python-половина аудита зависимостей не проверена — шаг красный (A103)"
            exit 1
          fi
          exit "$rc"

  delivery:
    runs-on: ubuntu-24.04
    # §8.7: фазовый гейт читает файлы; 10 минут с запасом.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0              # breakers и метрики считаются по merge-base..HEAD
          persist-credentials: false  # токен не остаётся в .git/config (A100)
      - name: Diff base (одна на джобу, отказ — вслух)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            before="${{ github.event.before }}"
            zero="0000000000000000000000000000000000000000"
            if [ -n "$before" ] && [ "$before" != "$zero" ] \
               && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              base="$before"
            else
              default="${{ github.event.repository.default_branch }}"
              base="$(git merge-base "origin/$default" HEAD 2>/dev/null || true)"
              if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
                echo "::error::база диффа не определима (before=$before, default=$default):"\
                     "первый push репозитория или переписанная история." \
                     "Открой PR или сделай второй коммит — гейт не имеет права судить пустоту."
                exit 1
              fi
            fi
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "база диффа: $base"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Delivery phase gate + circuit breakers
        run: python scripts/delivery_check.py --require-ci --diff-base "$BASE"

      # Подпись объявления необратимого (§3.4a, A105): без активной поставки — строка словами.
      - name: Irreversible signature
        if: always()
        run: |
          if [ ! -f delivery/active/STATUS.md ]; then
            echo "подпись: активной поставки нет — объявления и подписи судить нечем"
            exit 0
          fi
          bash scripts/check_irreversible_signature.sh

      - name: Canon sync gate (code <-> knowledge)
        if: always()
        run: |
          if [ -f scripts/okf_sync_gate.py ]; then
            python scripts/okf_sync_gate.py --base "$BASE"
          else
            echo "no OKF sync gate — skip"
          fi

      - name: Harness metrics (report only, never fails)
        if: always()
        run: |
          if [ -f scripts/delivery_metrics.py ]; then
            python scripts/delivery_metrics.py --base "$BASE" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Адаптация шаблона: здесь нет ни базы, ни зависимостей — smoke судит шаг «Smoke (S3, S1)»
      # джобы `tests`, а S2 — её шаг «Тесты с покрытием» (спека smoke, A376).
      - name: Smoke evals (product oracles)
        if: always()
        run: |
          if [ -f delivery/evals/smoke/run.sh ]; then
            echo "smoke §6.1 — шаг «Smoke (S3, S1)» джобы tests; S2 — её шаг «Тесты с покрытием»"
          else
            echo "no smoke suite — Delivery §6 backlog"
          fi

      - name: OKF bundle validator
        if: always()
        run: |
          if [ -f scripts/okf_validate.py ] && [ -d knowledge ]; then
            python scripts/okf_validate.py knowledge/
          else
            echo "no OKF bundle — skip"
          fi

      # Каноны вне репо (вариант D): объявление читает доктор, парсер YAML этой ветке не нужен.
      - name: Canon payload selftest (§7.1)
        if: always()
        run: |
          if [ -d docs/canon ]; then
            echo "::error::docs/canon/ есть, а проект объявил вариант D — снимок канонов в git не кладётся"
            exit 1
          fi
          where=$(python -B - <<'VARIANT'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts/lint")
          try:
              from doctor_versions import VersionChecks
              VersionChecks._declared_external
          except (ImportError, AttributeError) as exc:
              print("::error::объявление варианта читает доктор — scripts/lint/doctor_versions.py"
                    f" (cqg@2.97+), его нет или он старше: {exc}. Доложи комплект (§5.0).")
              sys.exit(2)
          class Repo(VersionChecks):
              root = Path(".")
          print(Repo()._declared_external())
          VARIANT
          ) || { echo "$where"; exit 1; }
          if [ -z "$where" ]; then
            echo "::error::снимка канонов в репо нет, а вариант B/D не объявлен (§7.1, §5 шаг 11)"
            exit 1
          fi
          echo "каноны вне репо — вариант B/D по объявлению в $where; инвариант назван"

  tests:
    runs-on: ubuntu-24.04
    # §8.7: установка и набор с покрытием — минуты; 15: мутации с хода 3 «Скорости CI» — в долях
    # `mutation-shard` (A289), прежние 30 (A99) держали бюджет мутаций 1200 с. Установка ~1 мин и
    # набор ~3 мин (A288: 162 с) — запас на медленную машину. Число держит тест контракта.
    timeout-minutes: 15
    services:
      # Как служба db в docker-compose.dev.yml: база живёт только в прогоне, пароль — публичный
      # пароль стенда. Образ — строкой стека «линия@дайджест» (A100). Готовность — `pg_isready` по
      # TCP внутри контейнера: порт на петле раннера отвечает раньше базы, а при первом старте
      # образ поднимает временный сервер только на сокете.
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit  # pragma: allowlist secret
          POSTGRES_DB: audit
        ports:
          - 127.0.0.1:5462:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U audit -d audit"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0              # база диффа покрытия изменённого (A108)
          persist-credentials: false  # токен не остаётся в .git/config (A100)
      - name: Diff base (одна на джобу, отказ — вслух)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            before="${{ github.event.before }}"
            zero="0000000000000000000000000000000000000000"
            if [ -n "$before" ] && [ "$before" != "$zero" ] \
               && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              base="$before"
            else
              default="${{ github.event.repository.default_branch }}"
              base="$(git merge-base "origin/$default" HEAD 2>/dev/null || true)"
              if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
                echo "::error::база диффа не определима (before=$before, default=$default):"\
                     "первый push репозитория или переписанная история." \
                     "Открой PR или сделай второй коммит — гейт не имеет права судить пустоту."
                exit 1
              fi
            fi
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "база диффа: $base"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Инструменты из замка
        run: |
          python -m pip install uv==0.11.26
          cd backend && uv sync --frozen

      # `--frozen` ставит по замку и свежесть замка не сверяет: версия, правленная в pyproject без
      # замка, прошла бы на старой (проба проверяющей 2026-11-20). Сверка — своим шагом.
      - name: Замок свежий
        working-directory: backend
        run: uv lock --check

      # Набор — один раз: покрытие src и migrations снимается здесь же, отчёт привязан к коммиту.
      # Итог «собрано N, прошло N, пропущено 0» печатает conftest; пропуск — красное (A106, A107).
      - name: Тесты с покрытием
        working-directory: backend
        run: |
          uv run --no-sync pytest --cov --cov-report=json:coverage.json
          git rev-parse HEAD > coverage.json.head

      # Сквозные проверки §6.1: S3 — миграции с нуля, S1 — сервер на этой базе. S2 — сам шаг выше:
      # пропуск по имени, вслух в итоге. Команда целиком, без глушилок и конвейера (A376).
      - name: Smoke (S3, S1)
        run: bash delivery/evals/smoke/run.sh --skip 'S2=набор прошёл шагом «Тесты с покрытием» этой джобы'

      # Отчёт этой джобы, а не второй прогон набора; база — шаг «Diff base» (A108).
      - name: Diff coverage
        env:
          LINT_PY_SRC: backend
          LINT_COV_FILE: backend/coverage.json
          MIN_PCT: "70"
        run: bash scripts/lint/check_diff_coverage.sh

  # Ход 3 «Скорости CI» (A289): порчи — на 4 машинах параллельно с `tests`. Доля берёт каждую 4-ю
  # группу файлов диффа — изменённый `__init__.py` идёт с файлами своего пакета (`MUTATION_SHARD`,
  # адаптация гейта — scripts/lint/adapted.json) и только считает;
  # счёт — артефактом, порог 60 % судит джоба суммы `mutation`. Бюджет 1200 с — на долю, как был на
  # весь шаг (слово владельца 2026-11-20T10:59Z); 30 мин: установка ~1 мин, 1200 с порч и 120 с
  # самопроверки — гейт успевает сказать «бюджет исчерпан» раньше таймаута.
  mutation-shard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false            # упавшая доля не снимает соседей: сумма назовёт её сама
      matrix:
        shard: [1, 2, 3, 4]
    services:
      # Как служба джобы `tests`, строка в строку; совпадение держит тест контракта (A289).
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit  # pragma: allowlist secret
          POSTGRES_DB: audit
        ports:
          - 127.0.0.1:5462:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U audit -d audit"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0              # база диффа мутаций (A109)
          persist-credentials: false  # токен не остаётся в .git/config (A100)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Инструменты из замка
        run: |
          python -m pip install uv==0.11.26
          cd backend && uv sync --frozen

      - name: Mutation testing (доля)
        env:
          BASE: origin/${{ github.base_ref }}
          LINT_PY_SRC: backend/src
          MUTATION_SHARD: ${{ matrix.shard }}/4
          MUTATION_WORKERS: "4"
          BUDGET_SEC: "1200"
        run: bash scripts/lint/check_mutation_gate.sh

      # Только на зелёном шаге доли: доля, не давшая счёта, артефакта не оставляет — сумма её назовёт.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: reports/mutation/shards/
          if-no-files-found: error
          retention-days: 1

  # Сумма долей (A289): порог 60 % — по сумме счёта всех четырёх. `if: always()` — упавшая, отменённая
  # или пропущенная доля не пропускает сумму: доля без счёта — красная сумма с номером доли, а
  # пропущенную обязательную проверку GitHub счёл бы пройденной.
  mutation:
    needs: mutation-shard
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # токен не остаётся в .git/config (A100)

      # Ни одной доли со счётом — артефактов нет, и шаг падает; гейт ниже назовёт номера долей сам.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with:
          pattern: mutation-shard-*
          path: reports/mutation/shards/
          merge-multiple: true

      - name: Mutation testing (сумма долей)
        env:
          MUTATION_SUM: "4"
          MIN_KILLED: "60"            # порог судит сумма, доля только считает (A109, A289)
        run: bash scripts/lint/check_mutation_gate.sh

  # «Оракул стека в CI» (A76): собранный образ делает продукт. Оракул Ч1.5а строит стек из чистой
  # копии `git archive HEAD` и гоняет шаги примеров; итог джобы — итог оракула. Docker и Python —
  # с раннера, пакеты не ставятся: оракул — стандартная библиотека. Время — по первому прогону.
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # токен не остаётся в .git/config (A100)
      - name: Оракул стека (A60–A67, A69, A73, A77–A84, A86, A87)
        run: python3 scripts/stack_oracle.py

  # Скан образа (A124–A129): Trivy 0.76.2 файлом выпуска по сумме, канарейка, скан файла образа
  # `docker save` — сокета Docker сканер не получает, опись CycloneDX того же файла. Права —
  # сверху, только чтение (A129; свой блок джобе запрещает тест контракта, A100).
  image-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # токен не остаётся в .git/config (A100)
      - name: Trivy 0.76.2 файлом выпуска (A124)
        run: python3 scripts/image_scan.py install --dir "$RUNNER_TEMP/trivy"
      - name: Канарейка и скан образов (A125, A126, A128)
        run: python3 scripts/image_scan.py run --work "$RUNNER_TEMP/scan" --trivy "$RUNNER_TEMP/trivy/trivy"
      - name: Опись CycloneDX (A127)
        run: python3 scripts/image_scan.py sbom --work "$RUNNER_TEMP/scan" --trivy "$RUNNER_TEMP/trivy/trivy"
