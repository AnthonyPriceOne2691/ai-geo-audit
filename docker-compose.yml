# Стек сервиса: db, redis, migrate, api, web. Урезанные права, сети и боевые отличия — Ч1.5б.
# Наружу — только порт web на петле. Секреты — только окружением сервера, ${VAR:?причина}: у
# процесса ровно переменные его проверки старта, прочее — поля конфига. Правила файла —
# ai_geo_audit.ops.stack_rules над `docker compose config --no-interpolate --format json`.
name: ai-geo-audit

# Урезанные права у каждого сервиса (A87): прав Linux нет, setuid их не добавит.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # Под пользователем образа: от root входной скрипт меняет права каталогов и пользователя, а прав
  # на это нет. Корень только для чтения: сокет, lock-файл и временные файлы — в tmpfs (A87).
  db:
    <<: *hardened
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    user: postgres
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    restart: unless-stopped
    # Срок мягкой остановки — на контрольную точку Postgres; по истечении докер убивает (A88).
    stop_grace_period: 60s
    networks: [data]
    environment:
      POSTGRES_USER: audit
      POSTGRES_DB: audit
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте пароль базы — .env.example, блок стека}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U audit -d audit"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    <<: *hardened
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    user: redis
    read_only: true
    restart: unless-stopped
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Миграции — тем же образом до api, одноразово: без перезапуска, сбой называется по имени.
  migrate:
    <<: *hardened
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
      target: backend
    image: ${BACKEND_IMAGE:-ai-geo-audit-backend:local}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    init: true
    read_only: true
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: prod
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?задайте адрес базы migrate — .env.example}

  api:
    <<: *hardened
    image: ${BACKEND_IMAGE:-ai-geo-audit-backend:local}
    restart: unless-stopped
    # Мягкая остановка uvicorn — 20 с (Ч1.3), ещё 10 с — на закрытие пулов: правило stop-grace.
    stop_grace_period: 30s
    init: true
    read_only: true
    networks: [data, front]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: prod
      LOG_FORMAT: json
      # Слушает все адреса контейнера: api слышит сеть стека; наружу портов нет (правило ports).
      API_HOST: 0.0.0.0
      DATABASE_URL: ${API_DATABASE_URL:?задайте адрес базы api — .env.example}
      # Очередь без пароля до «Учёток хранилищ»; там адрес — переменная сервера API_REDIS_URL.
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?задайте секрет подписи — openssl rand -hex 32}
      KEYS_MASTER_KEY_FILE: /run/secrets/master_key
      API_TRUSTED_PROXIES: ${WEB_ADDRESS:?задайте адрес web — единственный доверенный прокси}
    secrets:
      - master_key
    healthcheck:
      test: ["CMD", "python", "-m", "ai_geo_audit.api.probe"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Фронт под nginx от uid 101: порт — только на петле машины, к нему ходит прокси хоста (Ч1.6).
  # Проверка здоровья — страница, а не /api/health: перезапуск api не роняет статус web.
  web:
    <<: *hardened
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
      target: web
    image: ${WEB_IMAGE:-ai-geo-audit-web:local}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    # Постоянный адрес в front — единственный доверенный прокси api (A83); edge — для порта.
    networks:
      front:
        ipv4_address: ${WEB_ADDRESS:?задайте адрес web в подсети front}
      edge:
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:?задайте порт web на петле машины}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

# data — db, redis, migrate, api; front — api и web: обе без выхода наружу (A86). edge — обычная
# сеть только у web: опубликованному порту нужна сеть с выходом.
networks:
  data:
    internal: true
  front:
    internal: true
    ipam:
      config:
        - subnet: ${FRONT_SUBNET:?задайте подсеть front — /28 вне пулов докера}
  edge:

volumes:
  db-data:

secrets:
  master_key:
    file: ${KEYS_MASTER_KEY_HOST_FILE:?задайте путь к файлу мастер-ключа на машине}
