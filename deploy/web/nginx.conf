# Сервер web (Ч1.5б): страница сборки и любой путь экрана на порту выше 1024; заголовки защиты,
# CSP и кэш (A78–A80); свой журнал без строки запроса (A83); /api/ — к api (A81, A84). nginx — от
# uid 101, корень контейнера только для чтения: временные файлы — в /tmp.
client_body_temp_path /tmp/client_temp;
proxy_temp_path /tmp/proxy_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;

# Путь — как прислан, без строки запроса: $uri после try_files — уже /index.html, а $request_uri
# несёт параметры. Отрезано всё с первого «?».
map $request_uri $sent_path {
    "~^(?<sent>[^?]*)" $sent;
}
# Строка доступа (A83): время ISO 8601, метод, путь без «?», код, время ответа в секундах с тремя
# знаками, адрес клиента из X-Forwarded-For или «-». Ни строки запроса, ни заголовков пропуска.
log_format web '$time_iso8601 $request_method $sent_path $status $request_time '
               '$http_x_forwarded_for';

server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    # Для запросов журналы уровня server заменяют журналы главного файла образа: main и notice.
    access_log /dev/stdout web;
    error_log /dev/stderr crit;
    include /etc/nginx/snippets/security-headers.conf;

    # Любой путь экрана — страница приложения; страница — только со сверкой (no-cache).
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # Файлы сборки — с хешем в имени: год и immutable, одним заголовком.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /api/ — к api через DNS докера: адрес перечитывается раз в 10 с, и пересоздание api не требует
    # перезапуска web (A81). X-Forwarded-For — как прислан (A83); nosniff сервиса скрыт (A79).
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8107;
        proxy_pass $api;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_hide_header X-Content-Type-Options;
        client_max_body_size 1m;
        proxy_read_timeout 30s;
        error_page 413 @proxy-too-large;
        error_page 502 @proxy-bad-gateway;
        error_page 504 @proxy-gateway-timeout;
    }

    # Отказы web на /api/ (A84): тело — образец раздела «прокси» contracts/api-refusals.json, имя
    # location — его id; пустой types — тип образца и у пути с расширением.
    location @proxy-too-large {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        types { }
        default_type application/json;
        return 413 '{"detail": "Запрос слишком большой — можно не больше 1 МБ",
            "kind": "too-large", "retry": false}';
    }
    location @proxy-bad-gateway {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        types { }
        default_type application/json;
        return 502 '{"detail": "Сервис временно недоступен — повторите позже",
            "kind": "unavailable", "retry": true}';
    }
    location @proxy-gateway-timeout {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        types { }
        default_type application/json;
        return 504 '{"detail": "Сервис временно недоступен — повторите позже",
            "kind": "unavailable", "retry": true}';
    }
}
