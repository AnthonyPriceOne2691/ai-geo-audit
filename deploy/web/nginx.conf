# Сервер web — минимум среза 1 (Ч1.5б): страница сборки на порту выше 1024. Временные файлы —
# в /tmp: nginx — от uid 101, корень контейнера только для чтения. Заголовки защиты, CSP, кэш,
# любой путь экрана и /api/ — срезы 2–3.
client_body_temp_path /tmp/client_temp;
proxy_temp_path /tmp/proxy_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;

server {
    listen 8080;
    root /usr/share/nginx/html;
}
